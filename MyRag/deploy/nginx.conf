worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    # The API accepts uploads up to 1 GB.
    client_max_body_size 1024m;

    # Uvicorn instances. Add more servers (e.g. 127.0.0.1:8001) for throughput;
    # they are independent because all state is in Postgres.
    upstream myrag_app {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # Redirect plain HTTP to HTTPS. The ACME challenge stays on HTTP.
    server {
        listen 80;
        listen [::]:80;
        server_name myrag.myorganization.ir;

        location /.well-known/acme-challenge/ {
            root C:/nginx/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name myrag.myorganization.ir;

        ssl_certificate     C:/nginx/certs/myrag.myorganization.ir.crt;
        ssl_certificate_key C:/nginx/certs/myrag.myorganization.ir.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Server-Sent Events: never buffer, never compress.
        proxy_buffering off;
        proxy_cache     off;
        gzip            off;

        location / {
            proxy_pass http://myrag_app;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_buffering         off;
            proxy_cache             off;
            gzip                    off;
            chunked_transfer_encoding on;

            # Reasoning models can take several minutes.
            proxy_connect_timeout 75s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
        }
    }
}